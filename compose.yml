services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: red_huella
      POSTGRES_USER: red_huella_app
      POSTGRES_PASSWORD: red_huella_dev_only
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - red_huella_postgres_data:/var/lib/postgresql/data
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U red_huella_app -d red_huella']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  red_huella_postgres_data:
