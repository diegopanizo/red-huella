name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://red_huella_test:red_huella_test_ci@localhost:5432/red_huella_placeholder
      DATABASE_TEST_URL: postgresql://red_huella_test:red_huella_test_ci@localhost:5432/red_huella_test
      LOG_LEVEL: silent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PostgreSQL integration image
        run: >-
          docker build
          --tag red-huella-ci-postgres:pg17
          --file docker/ci-postgres/Dockerfile
          .

      - name: Start PostgreSQL integration container
        run: >-
          docker run --detach
          --name red-huella-ci-postgres
          --publish 5432:5432
          --env POSTGRES_DB=red_huella_test
          --env POSTGRES_USER=red_huella_test
          --env POSTGRES_PASSWORD=red_huella_test_ci
          red-huella-ci-postgres:pg17

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for attempt in {1..20}; do
            if docker exec red-huella-ci-postgres pg_isready \
              --username red_huella_test \
              --dbname red_huella_test; then
              exit 0
            fi
            sleep 2
          done

          docker logs red-huella-ci-postgres
          exit 1

      - name: Create placeholder database
        run: >-
          docker exec red-huella-ci-postgres
          createdb
          --username red_huella_test
          --owner red_huella_test
          red_huella_placeholder

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PostgreSQL integration tests
        run: npm run test:db
