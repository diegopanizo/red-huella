name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://red_huella_test:red_huella_test_ci@localhost:5432/red_huella_placeholder
      DATABASE_TEST_URL: postgresql://red_huella_test:red_huella_test_ci@localhost:5432/red_huella_test
      LOG_LEVEL: silent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PostgreSQL integration image
        run: >-
          docker build
          --tag red-huella-ci-postgres:pg17
          --file docker/ci-postgres/Dockerfile
          .

      - name: Start PostgreSQL integration container
        run: >-
          docker run --detach
          --name red-huella-ci-postgres
          --publish 5432:5432
          --env POSTGRES_DB=red_huella_test
          --env POSTGRES_USER=red_huella_test
          --env POSTGRES_PASSWORD=red_huella_test_ci
          red-huella-ci-postgres:pg17

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for attempt in {1..20}; do
            if docker exec red-huella-ci-postgres pg_isready \
              --username red_huella_test \
              --dbname red_huella_test; then
              exit 0
            fi
            sleep 2
          done

          docker logs red-huella-ci-postgres
          exit 1

      - name: Create placeholder database
        run: >-
          docker exec red-huella-ci-postgres
          createdb
          --username red_huella_test
          --owner red_huella_test
          red_huella_placeholder

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PostgreSQL integration tests
        run: npm run test:db

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://red_huella_e2e:red_huella_e2e_ci@localhost:5432/red_huella_e2e
      DATABASE_E2E_URL: postgresql://red_huella_e2e:red_huella_e2e_ci@localhost:5432/red_huella_e2e
      LOG_LEVEL: silent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PostgreSQL E2E image
        run: >-
          docker build
          --tag red-huella-e2e-postgres:pg17
          --file docker/ci-postgres/Dockerfile
          .

      - name: Start PostgreSQL E2E container
        run: >-
          docker run --detach
          --name red-huella-e2e-postgres
          --publish 5432:5432
          --env POSTGRES_DB=red_huella_e2e
          --env POSTGRES_USER=red_huella_e2e
          --env POSTGRES_PASSWORD=red_huella_e2e_ci
          red-huella-e2e-postgres:pg17

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for attempt in {1..20}; do
            if docker exec red-huella-e2e-postgres pg_isready \
              --username red_huella_e2e \
              --dbname red_huella_e2e; then
              exit 0
            fi
            sleep 2
          done

          docker logs red-huella-e2e-postgres
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

  production-container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: red_huella
      POSTGRES_USER: red_huella_migrator
      POSTGRES_PASSWORD: ci_migrator_password
      APP_DATABASE_PASSWORD: ci_app_password
      MIGRATION_DATABASE_URL: postgresql://red_huella_migrator:ci_migrator_password@postgres:5432/red_huella
      DATABASE_URL: postgresql://red_huella_app:ci_app_password@postgres:5432/red_huella
      WEB_ORIGIN: https://red-huella.test
      LOG_LEVEL: silent
      IMAGE_STORAGE_DRIVER: local
      IMAGE_STORAGE_LOCAL_ROOT: /app/.data/uploads
      VISUAL_EMBEDDING_PROCESSOR_ENABLED: 'false'
      VISUAL_EMBEDDING_POLL_INTERVAL_MS: 30000
      VISUAL_EMBEDDING_BATCH_SIZE: 5
      WEB_HTTP_PORT: 18080
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare empty model mount
        run: mkdir -p .data/models

      - name: Validate production Compose
        run: docker compose -f compose.prod.yml config --quiet

      - name: Build production images
        run: docker compose -f compose.prod.yml build

      - name: Start production stack
        run: docker compose -f compose.prod.yml up --detach

      - name: Verify containers and healthchecks
        shell: bash
        run: |
          for attempt in {1..36}; do
            if curl --fail --silent http://127.0.0.1:18080/ >/dev/null && \
              curl --fail --silent http://127.0.0.1:18080/api/v1/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              docker compose -f compose.prod.yml ps --all
              docker compose -f compose.prod.yml logs --no-color
              exit 1
            fi
            sleep 5
          done

          postgres_id="$(docker compose -f compose.prod.yml ps --quiet postgres)"
          migrate_id="$(docker compose -f compose.prod.yml ps --all --quiet migrate)"
          api_id="$(docker compose -f compose.prod.yml ps --quiet api)"

          test "$(docker inspect --format '{{.State.Health.Status}}' "$postgres_id")" = healthy
          test "$(docker inspect --format '{{.State.ExitCode}}' "$migrate_id")" = 0
          test "$(docker inspect --format '{{.State.Health.Status}}' "$api_id")" = healthy

      - name: Show production container logs on failure
        if: failure()
        run: |
          docker compose -f compose.prod.yml ps --all
          docker compose -f compose.prod.yml logs --no-color

      - name: Remove production smoke resources
        if: always()
        run: docker compose -f compose.prod.yml down --volumes --remove-orphans
